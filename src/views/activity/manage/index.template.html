<div class="activity-page app-container">
  <template v-if="isFormMode">
    <section class="editor-panel">
      <div>
        <div v-if="!isFirstDepositMode" class="editor-panel__eyebrow">活动管理</div>
        <h1 class="editor-panel__title">{{ formPageTitle }}</h1>
        <p v-if="!isFirstDepositMode" class="editor-panel__subtitle">{{ formPageSubtitle }}</p>
      </div>
      <el-button icon="el-icon-back" @click="exitEditMode">返回活动列表</el-button>
    </section>

    <activity-common-form
      v-if="isCommonEditMode"
      :key="'common-edit-' + routeActivityId"
      mode="edit"
      :activity-id="routeActivityId"
      :meta="meta"
      @success="handleEditSuccess"
      @cancel="exitEditMode"
    />

    <activity-form
      v-else
      :key="activityFormKey"
      :mode="isCreateMode ? 'create' : 'edit'"
      :activity-id="routeActivityId"
      :initial-activity-type="routeActivityType"
      :meta="meta"
      @success="handleFormSuccess"
      @cancel="exitEditMode"
    />
  </template>

  <template v-else>
    <section ref="pageHeader" class="page-header">
      <h1 ref="pageTitle" class="page-title">活动列表</h1>
    </section>

    <section class="filter-card">
      <el-form ref="queryForm" :model="queryParams" label-width="80px" class="filter-form" @submit.native.prevent>
        <div class="filter-form__row filter-form__row--primary">
          <el-form-item label="站点" class="filter-item" prop="siteCode">
            <el-select
              v-model="queryParams.siteCode"
              multiple
              collapse-tags
              :disabled="isSiteReadonly"
              :clearable="!isSiteReadonly"
              placeholder="全部站点"
              style="width: 100%"
            >
              <el-option
                v-for="item in siteOptions"
                :key="item.value"
                :label="item.label"
                :value="item.value"
              />
            </el-select>
          </el-form-item>

          <el-form-item label="活动标题" class="filter-item" prop="activityName">
            <el-autocomplete
              v-model="queryParams.activityName"
              :fetch-suggestions="queryActivityNameSuggestions"
              :trigger-on-focus="true"
              clearable
              placeholder="输入活动标题"
              style="width: 100%"
              @keyup.enter.native="handleQuery"
              @select="handleActivityNameSelect"
            />
          </el-form-item>

          <el-form-item label="活动类型" class="filter-item" prop="activityType">
            <el-select
              v-model="queryParams.activityType"
              multiple
              collapse-tags
              clearable
              placeholder="全部类型"
              style="width: 100%"
            >
              <el-option
                v-for="item in activityTypeOptions"
                :key="item.value"
                :label="item.label"
                :value="item.value"
              />
            </el-select>
          </el-form-item>

          <el-form-item label="活动标签" class="filter-item" prop="activityTag">
            <el-select
              v-model="queryParams.activityTag"
              multiple
              collapse-tags
              clearable
              placeholder="全部标签"
              style="width: 100%"
            >
              <el-option
                v-for="item in activityTagOptions"
                :key="item.value"
                :label="item.label"
                :value="item.value"
              />
            </el-select>
          </el-form-item>

          <el-form-item label="展示时间" class="filter-item filter-item--date">
            <el-date-picker
              v-model="displayTimeRange"
              type="datetimerange"
              range-separator="~"
              start-placeholder="开始时间"
              end-placeholder="结束时间"
              format="yyyy-MM-dd HH:mm:ss"
              value-format="yyyy-MM-dd HH:mm:ss"
              style="width: 100%"
            />
          </el-form-item>
        </div>

        <div class="filter-form__row filter-form__row--secondary">
          <el-form-item label="活动时间" class="filter-item filter-item--date">
            <el-date-picker
              v-model="activityTimeRange"
              type="datetimerange"
              range-separator="~"
              start-placeholder="开始时间"
              end-placeholder="结束时间"
              format="yyyy-MM-dd HH:mm:ss"
              value-format="yyyy-MM-dd HH:mm:ss"
              style="width: 100%"
            />
          </el-form-item>

          <div class="filter-actions">
            <el-button class="filter-action" @click="resetQuery">重置</el-button>
            <el-button type="primary" class="filter-action filter-action--primary" @click="handleQuery">查询</el-button>
            <el-button
              type="primary"
              class="filter-action filter-action--primary"
              v-hasPermi="['activity:manage:add']"
              @click="handleAdd"
            >新增活动</el-button>
          </div>
        </div>
      </el-form>
    </section>

    <section ref="tableCard" class="table-card">
      <el-table
        v-loading="loading"
        :data="activityList"
        empty-text="没有查到结果"
        class="activity-table"
      >
        <el-table-column label="序号" align="center" width="72" fixed="left">
          <template slot-scope="scope">
            <span>{{ (queryParams.pageNum - 1) * queryParams.pageSize + scope.$index + 1 }}</span>
          </template>
        </el-table-column>
        <el-table-column label="站点" align="center" min-width="110" fixed="left">
          <template slot-scope="scope">
            <span>{{ scope.row.siteName || scope.row.siteCode || '-' }}</span>
          </template>
        </el-table-column>
        <el-table-column label="活动标题" align="center" prop="activityName" min-width="220" fixed="left">
          <template slot-scope="scope">
            <span class="activity-name">{{ scope.row.activityName || '-' }}</span>
          </template>
        </el-table-column>
        <el-table-column label="活动类型" align="center" prop="activityType" min-width="150">
          <template slot-scope="scope">
            <div class="activity-type-summary">
              <span class="activity-type-text">{{ activityTypeLabels(scope.row)[0].label }}</span>
              <el-button
                v-if="activityTypeLabels(scope.row).length > 1"
                type="text"
                class="activity-type-more"
                @click="showActivityTypes(scope.row)"
              >更多</el-button>
            </div>
          </template>
        </el-table-column>
        <el-table-column label="活动标签" align="center" prop="activityTag" min-width="100">
          <template slot-scope="scope">
            <span>{{ scope.row.activityTag || '-' }}</span>
          </template>
        </el-table-column>
        <el-table-column label="展示时间" align="center" min-width="300">
          <template slot-scope="scope">
            <span>{{ formatActivityRange(scope.row.displayBeginTime, scope.row.displayEndTime) }}</span>
          </template>
        </el-table-column>
        <el-table-column label="活动时间" align="center" min-width="300">
          <template slot-scope="scope">
            <span>{{ formatActivityRange(scope.row.activityBeginTime, scope.row.activityEndTime) }}</span>
          </template>
        </el-table-column>
        <el-table-column label="排序" align="center" prop="activitySort" width="80" />
        <el-table-column label="最后操作时间" align="center" prop="updateTime" min-width="176">
          <template slot-scope="scope">
            <span>{{ parseTime(scope.row.updateTime, '{y}-{m}-{d} {h}:{i}:{s}') || '-' }}</span>
          </template>
        </el-table-column>
        <el-table-column label="最后操作人" align="center" prop="operatorName" min-width="110">
          <template slot-scope="scope">
            <span>{{ scope.row.operatorName || '-' }}</span>
          </template>
        </el-table-column>
        <el-table-column label="状态" align="center" prop="status" min-width="120" fixed="right">
          <template slot-scope="scope">
            <div class="activity-status-switch">
              <el-switch
                v-model="scope.row.status"
                active-value="0"
                inactive-value="1"
                active-color="#20b56d"
                inactive-color="#c0c4cc"
                @change="handleStatusSwitchChange(scope.row, $event)"
              />
              <span
                :class="['activity-status-switch__label', isActivityEnabled(scope.row) ? 'is-enabled' : 'is-disabled']"
              >{{ isActivityEnabled(scope.row) ? '启用' : '禁用' }}</span>
            </div>
          </template>
        </el-table-column>
        <el-table-column label="操作" align="center" min-width="132" fixed="right" class-name="activity-settings-column">
          <template slot-scope="scope">
            <div class="activity-settings">
              <span class="action-slot action-slot--config">
                <el-button
                  type="text"
                  class="primary-link"
                  v-hasPermi="['activity:manage:edit']"
                  @click="handleConfig(scope.row)"
                >编辑</el-button>
              </span>
              <span class="action-slot action-slot--delete">
                <el-button
                  type="text"
                  class="danger-link"
                  :disabled="isActivityEnabled(scope.row)"
                  v-hasPermi="['activity:manage:edit']"
                  @click="handleDelete(scope.row)"
                >删除</el-button>
              </span>
            </div>
          </template>
        </el-table-column>
      </el-table>

      <div class="table-card__pagination">
        <pagination
          v-show="total > 0"
          :total="total"
          :page.sync="queryParams.pageNum"
          :limit.sync="queryParams.pageSize"
          @pagination="getList"
        />
      </div>
    </section>

    <el-dialog
      title="全部活动类型"
      :visible.sync="activityTypesPreviewVisible"
      width="420px"
      custom-class="activity-types-preview-dialog"
      append-to-body
    >
      <el-table :data="activityTypesPreviewList" border class="activity-types-preview-table">
        <el-table-column label="序号" align="center" width="90">
          <template slot-scope="scope">{{ scope.$index + 1 }}</template>
        </el-table-column>
        <el-table-column label="活动类型" align="center" prop="label" />
      </el-table>
      <div slot="footer" class="dialog-footer">
        <el-button type="primary" @click="activityTypesPreviewVisible = false">知道了</el-button>
      </div>
    </el-dialog>

    <el-dialog
      title="选择活动类型"
      :visible.sync="activityTypeDialogVisible"
      width="760px"
      custom-class="activity-type-select-dialog"
      append-to-body
      destroy-on-close
      :close-on-click-modal="false"
    >
      <div class="activity-type-select">
        <button
          v-for="item in createActivityTypeOptions"
          :key="item.value"
          type="button"
          :disabled="item.disabled"
          :class="['activity-type-select__card', { 'is-active': selectedCreateActivityType === item.value, 'is-disabled': item.disabled }]"
          @click="handleSelectCreateActivityType(item)"
        >
          <span class="activity-type-select__title">{{ item.label }}</span>
          <span class="activity-type-select__desc">{{ item.description }}</span>
        </button>
      </div>
      <div slot="footer" class="dialog-footer">
        <el-button @click="activityTypeDialogVisible = false">取消</el-button>
        <el-button type="primary" :disabled="!selectedCreateActivityType" @click="handleConfirmCreateActivityType">下一步</el-button>
      </div>
    </el-dialog>

    <el-dialog
      title="新增通用活动"
      :visible.sync="createCommonDialogVisible"
      :width="createDialogWidth"
      :style="createDialogStyle"
      :top="createDialogTop"
      custom-class="activity-manage-dialog"
      append-to-body
      destroy-on-close
      :close-on-click-modal="false"
    >
      <activity-common-form
        v-if="createCommonDialogVisible"
        :key="'common-create-' + createDialogKey"
        mode="create"
        :meta="meta"
        @success="handleCreateSuccess"
        @cancel="createCommonDialogVisible = false"
      />
    </el-dialog>
  </template>
</div>
