<div class="app-container agent-list-page">
  <el-tabs v-model="activeAgentTab" class="agent-management-tabs">
    <el-tab-pane label="代理列表" name="list">
      <el-form
        ref="queryForm"
        :model="queryParams"
        :inline="true"
        label-width="82px"
        class="agent-list-query"
      >
        <el-form-item label="代理ID" prop="agentId">
          <el-input
            v-model.trim="queryParams.agentId"
            placeholder="请输入代理ID"
            clearable
            @keyup.enter.native="handleQuery"
          />
        </el-form-item>
        <el-form-item label="代理账号" prop="name">
          <el-input
            v-model.trim="queryParams.name"
            placeholder="请输入代理账号"
            clearable
            @keyup.enter.native="handleQuery"
          />
        </el-form-item>
        <el-form-item label="推荐人" prop="recommender">
          <el-select v-model="queryParams.recommender" placeholder="请输入或选择推荐人" clearable filterable>
            <el-option
              v-for="item in recommenderSelectOptions"
              :key="item"
              :label="item"
              :value="item"
            />
          </el-select>
        </el-form-item>
        <el-form-item label="站点编码" prop="siteCode">
          <el-select v-model="queryParams.siteCode" placeholder="请选择站点" clearable filterable>
            <el-option
              v-for="site in siteOptions"
              :key="site.code"
              :label="site.code + ' - ' + site.nameZn"
              :value="site.code"
            />
          </el-select>
        </el-form-item>
        <el-form-item label="代理类型" prop="agentType">
          <el-select v-model="queryParams.agentType" placeholder="全部类型" clearable>
            <el-option label="星级代理" value="star" />
            <el-option label="层级代理" value="multi" />
            <el-option label="团队代理" value="team" />
          </el-select>
        </el-form-item>
        <el-form-item label="代理状态" prop="agentStatus">
          <el-select v-model="queryParams.agentStatus" placeholder="代理状态" clearable>
            <el-option label="正常" :value="1" />
            <el-option label="停用" :value="0" />
          </el-select>
        </el-form-item>
        <el-form-item label="谷歌验证" prop="googleVerify">
          <el-select v-model="queryParams.googleVerify" placeholder="全部状态" clearable>
            <el-option label="已绑定" value="bound" />
            <el-option label="未绑定" value="unbound" />
          </el-select>
        </el-form-item>
        <el-form-item label="代理注册时间" label-width="110px">
          <el-date-picker
            v-model="dateRange"
            type="daterange"
            range-separator="至"
            start-placeholder="开始时间"
            end-placeholder="结束时间"
            value-format="yyyy-MM-dd"
          />
        </el-form-item>
        <el-form-item class="query-actions">
          <el-button type="primary" icon="el-icon-search" @click="handleQuery">搜索</el-button>
          <el-button icon="el-icon-refresh" @click="resetQuery">重置</el-button>
        </el-form-item>
      </el-form>

      <el-row :gutter="10" class="mb8 agent-list-actions">
        <el-col :span="1.5">
          <el-button type="primary" icon="el-icon-plus" @click="handleAdd">新增代理</el-button>
        </el-col>
        <el-col :span="1.5">
          <el-button type="success" icon="el-icon-edit" :disabled="single" @click="handleUpdate">修改</el-button>
        </el-col>
        <el-col :span="1.5">
          <el-button type="warning" icon="el-icon-lock" :disabled="single" @click="handleResetPwd">修改密码</el-button>
        </el-col>
        <el-col :span="1.5">
          <el-button type="success" icon="el-icon-link" :disabled="single" @click="handleBindDomain">绑定专属域名</el-button>
        </el-col>
        <el-col :span="1.5">
          <el-button type="info" icon="el-icon-download" :loading="exportLoading" @click="handleExport">导出</el-button>
        </el-col>
        <el-col :span="1.5">
          <el-button icon="el-icon-folder-opened" disabled>下载文件</el-button>
        </el-col>
      </el-row>

      <el-table
        v-loading="loading"
        :data="agentList"
        border
        class="agent-list-table"
        @selection-change="handleSelectionChange"
      >
        <el-table-column type="selection" width="48" align="center" fixed="left" />
        <el-table-column label="代理ID" align="center" prop="id" width="90" fixed="left" />
        <el-table-column label="代理账号" align="center" prop="name" width="170" fixed="left">
          <template slot-scope="scope">
            <el-button type="text" @click="handleUpdate(scope.row)">{{ scope.row.name }}</el-button>
          </template>
        </el-table-column>
        <el-table-column label="专属域名" align="center" prop="dedicatedDomain" min-width="150" />
        <el-table-column label="代理注册时间" align="center" prop="regTime" width="180">
          <template slot-scope="scope">
            <span>{{ parseTime(scope.row.regTime, '{y}-{m}-{d} {h}:{i}:{s}') }}</span>
          </template>
        </el-table-column>
        <el-table-column label="代理类型" align="center" prop="agentType" width="150">
          <template slot-scope="scope">
            <el-tag :type="scope.row.agentType === 'team' ? '' : scope.row.agentType === 'multi' ? 'warning' : 'success'" effect="plain">
              {{ formatAgentType(scope.row.agentType) }}
            </el-tag>
          </template>
        </el-table-column>
        <el-table-column label="代理身份" align="center" prop="agentIdentity" width="110">
          <template slot-scope="scope">
            <el-tag v-if="scope.row.agentIdentity !== '-'" effect="plain">{{ scope.row.agentIdentity }}</el-tag>
            <span v-else>-</span>
          </template>
        </el-table-column>
        <el-table-column label="招商人员" align="center" prop="recruiter" width="120">
          <template slot-scope="scope">{{ scope.row.recruiter || '-' }}</template>
        </el-table-column>
        <el-table-column label="发展人" align="center" prop="developer" width="120">
          <template slot-scope="scope">{{ scope.row.developer || '-' }}</template>
        </el-table-column>
        <el-table-column label="推荐人" align="center" prop="recommender" width="120">
          <template slot-scope="scope">{{ scope.row.recommender || '-' }}</template>
        </el-table-column>
        <el-table-column label="星级级别" align="center" prop="starLevel" width="110">
          <template slot-scope="scope">
            <span>{{ scope.row.agentType === 'star' ? formatStarLevel(scope.row.starLevel || 1) : '-' }}</span>
          </template>
        </el-table-column>
        <el-table-column label="层级级别" align="center" prop="agentLevel" width="110">
          <template slot-scope="scope">
            <span>{{ scope.row.agentType === 'multi' ? formatAgentLevel(scope.row.agentLevel || 1) : '-' }}</span>
          </template>
        </el-table-column>
        <el-table-column label="站点编码" align="center" prop="siteCode" width="150">
          <template slot-scope="scope">
            <span>{{ scope.row.siteCode }}</span>
            <el-tag v-if="getSiteName(scope.row.siteCode)" size="mini" type="info" class="site-name-tag">
              {{ getSiteName(scope.row.siteCode) }}
            </el-tag>
          </template>
        </el-table-column>
        <el-table-column label="上级代理" align="center" prop="parentAgentName" min-width="140" show-overflow-tooltip />
        <el-table-column label="代理状态" align="center" prop="agentStatus" width="100">
          <template slot-scope="scope">
            <el-tag :type="scope.row.agentStatus === 1 ? 'success' : 'danger'">
              {{ scope.row.agentStatus === 1 ? '正常' : '停用' }}
            </el-tag>
          </template>
        </el-table-column>
        <el-table-column label="谷歌验证" align="center" prop="googleVerify" width="105">
          <template slot-scope="scope">
            <el-tag :type="scope.row.googleVerify === 'bound' ? 'success' : 'info'" effect="plain">
              {{ scope.row.googleVerify === 'bound' ? '已绑定' : '未绑定' }}
            </el-tag>
          </template>
        </el-table-column>
        <el-table-column label="下属代理" align="center" prop="subAgentCount" width="100">
          <template slot-scope="scope"><el-button type="text">{{ scope.row.subAgentCount }}</el-button></template>
        </el-table-column>
        <el-table-column label="下属会员" align="center" prop="subMemberCount" width="100">
          <template slot-scope="scope"><el-button type="text">{{ scope.row.subMemberCount }}</el-button></template>
        </el-table-column>
        <el-table-column label="佣金方案" align="center" prop="commissionPlanName" min-width="170" show-overflow-tooltip />
        <el-table-column label="待生效方案" align="center" prop="pendingCommissionPlanName" min-width="135" />
        <el-table-column label="代理返佣比例" align="center" prop="commissionRate" width="125">
          <template slot-scope="scope">{{ formatCommissionRatePercent(scope.row.commissionRate) }}</template>
        </el-table-column>
        <el-table-column label="代理钱包余额" align="center" prop="centerBalanceCnySum" width="135">
          <template slot-scope="scope">{{ formatWalletBalance(scope.row.centerBalanceCnySum) }}</template>
        </el-table-column>
        <el-table-column label="最后登录" align="center" prop="lastLoginTime" width="180">
          <template slot-scope="scope">
            <span>{{ scope.row.lastLoginTime ? parseTime(scope.row.lastLoginTime, '{y}-{m}-{d} {h}:{i}') : '-' }}</span>
          </template>
        </el-table-column>
        <el-table-column label="操作" align="center" class-name="small-padding" width="270" fixed="right">
          <template slot-scope="scope">
            <el-button size="mini" type="text" icon="el-icon-edit" @click="handleUpdate(scope.row)">修改</el-button>
            <el-button size="mini" type="text" icon="el-icon-lock" @click="handleResetPwd(scope.row)">修改密码</el-button>
            <el-button size="mini" type="text" icon="el-icon-lock" @click="handleResetWithdrawPwd(scope.row)">
              重置取款密码
            </el-button>
          </template>
        </el-table-column>
      </el-table>

      <pagination
        v-show="total > 0"
        :total="Number(total)"
        :page.sync="queryParams.pageNum"
        :limit.sync="queryParams.pageSize"
        @pagination="getList"
      />
    </el-tab-pane>

    <el-tab-pane label="代理注册审核" name="registerAudit">
      <agent-register-audit :show-site="true" :site-options="siteOptions" @approved="getList" />
    </el-tab-pane>
  </el-tabs>

  <el-dialog :title="title" :visible.sync="open" width="690px" append-to-body @close="cancel">
    <el-form ref="form" :model="form" :rules="rules" label-width="110px" class="agent-edit-form">
      <el-form-item label="代理账号" prop="name">
        <el-input
          v-model="form.name"
          placeholder="请输入字母或数字"
          :disabled="!!form.id"
          @input="handleAgentAccountInput"
        />
      </el-form-item>

      <el-form-item v-if="!form.id" label="密码" prop="password">
        <el-input v-model="form.password" placeholder="请输入密码" type="password" show-password />
      </el-form-item>

      <el-form-item label="站点编码" prop="siteCode">
        <el-select
          v-model="form.siteCode"
          placeholder="请选择站点"
          style="width: 100%"
          clearable
          filterable
          :disabled="!!form.id"
          @change="handleSiteChange"
        >
          <el-option
            v-for="site in siteOptions"
            :key="site.code"
            :label="site.code + ' - ' + site.nameZn"
            :value="site.code"
          />
        </el-select>
      </el-form-item>

      <el-form-item v-if="!form.id" label="代理类型" prop="agentType">
        <el-select v-model="form.agentType" placeholder="请选择代理类型" style="width: 100%" @change="handleAgentTypeChange">
          <el-option label="星级代理" value="star" />
          <el-option label="层级代理" value="multi" />
          <el-option label="团队代理" value="team" />
        </el-select>
      </el-form-item>

      <template v-if="!form.id && form.agentType === 'team'">
        <el-form-item label="代理身份">
          <el-select
            v-model="form.agentIdentity"
            placeholder="请选择代理身份"
            style="width: 100%"
            @change="handleTeamIdentityChange"
          >
            <el-option label="官方代理" value="official" />
            <el-option label="普通代理" value="normal" />
          </el-select>
        </el-form-item>

        <el-form-item label="是否可以新增副线">
          <el-radio-group
            v-model="form.canAddSubline"
            :disabled="!form.agentIdentity"
            @change="handleCanAddSublineChange"
          >
            <el-radio :label="1">是</el-radio>
            <el-radio :label="0">否</el-radio>
          </el-radio-group>
        </el-form-item>

        <el-form-item v-if="form.agentIdentity" label="团队角色">
          <span v-if="form.canAddSubline === 1">团队负责人【多线】</span>
          <el-select
            v-else
            v-model="form.teamRole"
            placeholder="请选择团队角色"
            style="width: 100%"
            :disabled="form.canAddSubline !== 0"
            @change="handleTeamRoleChange"
          >
            <el-option label="团队负责人【单线】" value="leader_single" />
            <el-option label="副线" value="branch" />
          </el-select>
        </el-form-item>

        <template v-if="isTeamLeaderRole">
          <el-form-item label="团队名称">
            <el-input v-model="form.teamName" placeholder="请输入团队名称" />
          </el-form-item>

          <el-form-item label="佣金方案" prop="commissionPlanId">
            <el-select
              v-model="form.commissionPlanId"
              placeholder="请选择佣金方案"
              clearable
              filterable
              style="width: 100%"
              @change="handleCommissionPlanChange"
            >
              <el-option
                v-for="plan in teamCommissionOptions"
                :key="plan.id"
                :label="plan.planName + '（团队代理返佣）'"
                :value="plan.id"
              />
            </el-select>
          </el-form-item>

        </template>

        <template v-else-if="isTeamBranchRole">
          <el-form-item label="所属团队">
            <el-select
              v-model="form.teamId"
              placeholder="按团队ID或名称搜索"
              clearable
              filterable
              style="width: 100%"
            >
              <el-option
                v-for="team in teamOptions"
                :key="team.id"
                :label="team.id + ' / ' + team.name"
                :value="team.id"
              />
            </el-select>
          </el-form-item>

        </template>
      </template>

      <template v-if="!form.id && isCommissionAgentType">
        <el-form-item label="佣金方案" prop="commissionPlanId">
          <el-select
            v-model="form.commissionPlanId"
            placeholder="请选择佣金方案"
            style="width: 100%"
            clearable
            filterable
            @change="handleCommissionPlanChange"
          >
            <el-option
              v-for="plan in availableCommissionOptions"
              :key="plan.id"
              :label="plan.planName + '（' + plan.commTypeName + '）'"
              :value="plan.id"
            />
          </el-select>
        </el-form-item>

        <el-form-item v-if="isStarModel && form.commissionPlanId" label="星级级别" prop="starLevel">
          <el-select v-model="form.starLevel" placeholder="请选择星级级别" style="width: 100%">
            <el-option
              v-for="level in starLevelOptions"
              :key="level"
              :label="level + '星代理'"
              :value="level"
            />
          </el-select>
        </el-form-item>

        <el-form-item v-if="isMultiModel && form.commissionPlanId" label="层级级别" prop="agentLevel">
          <el-select v-model="form.agentLevel" placeholder="请选择层级级别" style="width: 100%">
            <el-option
              v-for="level in multiLevelOptions"
              :key="level"
              :label="level + '层代理'"
              :value="level"
            />
          </el-select>
        </el-form-item>

        <el-form-item v-if="showCommissionRate && form.commissionPlanId" label="返佣比例">
          <span>{{ currentCommissionRateText }}</span>
          <span v-if="isMultiModel && currentSiteProfitShareRate !== null" class="rate-limit-tip">
            站点上限：{{ currentSiteProfitShareRateText }}，代理返佣必须低于站点返佣
          </span>
        </el-form-item>
      </template>

      <template v-if="form.id && (isOriginalStarModel || isOriginalMultiModel)">
        <el-form-item label="佣金方案">
          <el-select :value="editCommissionPlanValue" disabled style="width: 100%">
            <el-option :label="editCommissionPlanLabel" :value="editCommissionPlanValue" />
          </el-select>
        </el-form-item>

        <el-form-item v-if="isOriginalStarModel" label="星级级别" prop="starLevel">
          <el-select v-model="form.starLevel" placeholder="请选择星级级别" style="width: 100%">
            <el-option
              v-for="level in starLevelOptions"
              :key="level"
              :label="level + '星代理'"
              :value="level"
            />
          </el-select>
        </el-form-item>

        <el-form-item v-if="isOriginalMultiModel" label="层级级别" prop="agentLevel">
          <el-select v-model="form.agentLevel" placeholder="请选择层级级别" style="width: 100%">
            <el-option
              v-for="level in multiLevelOptions"
              :key="level"
              :label="level + '层代理'"
              :value="level"
            />
          </el-select>
        </el-form-item>

        <el-form-item label="返佣比例">
          <span>{{ editCommissionRateText }}</span>
          <span v-if="isOriginalMultiModel" class="rate-limit-tip">
            站点上限：{{ editSiteProfitShareRateText }}，代理返佣必须低于站点返佣
          </span>
        </el-form-item>
      </template>

      <template v-if="form.id && isOriginalTeamModel">
        <el-form-item label="当前团队">
          <span>{{ form.currentTeam || '-' }}</span>
        </el-form-item>
        <el-form-item label="当前佣金方案">
          <span>{{ form.commissionPlanName || '-' }}</span>
        </el-form-item>
        <el-form-item label="目标身份" prop="targetIdentity">
          <el-select v-model="form.targetIdentity" style="width: 100%" @change="handleTargetIdentityChange">
            <el-option label="保持副线" value="keep" />
            <el-option label="当前团队负责人【多线】" value="current_leader_multi" />
            <el-option label="新团队负责人【单线】" value="new_leader_single" />
          </el-select>
        </el-form-item>

        <el-form-item v-if="form.targetIdentity === 'new_leader_single'" label="新团队名称">
          <el-input v-model="form.newTeamName" placeholder="请输入唯一团队名称" />
        </el-form-item>

        <el-form-item v-if="showPendingTeamCommissionPlan" label="下次结算佣金方案">
          <el-select
            v-model="form.pendingCommissionPlanId"
            placeholder="请选择佣金方案"
            clearable
            filterable
            style="width: 100%"
            @change="handlePendingCommissionPlanChange"
          >
            <el-option
              v-for="plan in teamCommissionOptions"
              :key="plan.id"
              :label="plan.planName + '（团队代理返佣）'"
              :value="plan.id"
            />
          </el-select>
          <div class="settlement-plan-hint">修改后在下一次正式佣金结算前生效，团队副线同步使用同一方案。</div>
        </el-form-item>
      </template>

      <el-form-item v-if="form.id || form.agentType !== 'team'" class="operation-expense-bear" prop="bearAllOperationExpense">
        <template slot="label">承担全部运营费</template>
        <el-radio-group v-model="form.bearAllOperationExpense" @change="handleBearAllOperationExpenseChange">
          <el-radio :label="1">是</el-radio>
          <el-radio :label="0">否</el-radio>
        </el-radio-group>
        <div class="operation-expense-hint">仅对直属会员有效</div>
        <el-checkbox-group
          v-if="!form.id && form.bearAllOperationExpense === 1"
          v-model="form.bearOperationExpenseTypes"
          class="operation-expense-types"
        >
          <el-checkbox
            v-for="item in operationExpenseTypeOptions"
            :key="item.value"
            :label="item.value"
            border
          >
            {{ item.label }}
          </el-checkbox>
        </el-checkbox-group>
      </el-form-item>

      <el-form-item v-if="!form.id && form.agentType === 'multi' && form.commissionPlanId" label="上级代理" prop="agentCode">
        <el-select
          v-model="form.agentCode"
          placeholder="可选，留空表示顶级代理"
          clearable
          filterable
          style="width: 100%"
        >
          <el-option
            v-for="agent in multiLevelParentOptions"
            :key="agent.id"
            :label="agent.id + ' / ' + agent.name"
            :value="agent.id"
            style="height: 56px; line-height: 20px; padding-top: 7px; padding-bottom: 7px"
          >
            <div class="parent-agent-option">
              <strong>{{ agent.id }} / {{ agent.name }}</strong>
              <span>{{ formatAgentLevel(agent.agentLevel || 1) }} ｜ 返佣 {{ formatParentAgentRate(agent) }}</span>
            </div>
          </el-option>
        </el-select>
      </el-form-item>

      <el-form-item v-if="form.id && (isOriginalStarModel || isOriginalMultiModel)" label="上级代理" prop="agentCode">
        <el-select
          v-model="form.agentCode"
          placeholder="可选，留空表示顶级代理"
          clearable
          filterable
          style="width: 100%"
        >
          <el-option
            v-for="agent in multiLevelParentOptions"
            :key="agent.id"
            :label="agent.id + ' / ' + agent.name"
            :value="agent.id"
          />
        </el-select>
      </el-form-item>

      <el-form-item v-if="form.id && (isOriginalStarModel || isOriginalMultiModel)" label="是否迁移本期未结算费用">
        <el-radio-group v-model="form.migrateUnsettledExpense">
          <el-radio :label="1">是</el-radio>
          <el-radio :label="0">否</el-radio>
        </el-radio-group>
      </el-form-item>

      <el-form-item label="招商人员">
        <el-select v-model="form.recruiter" placeholder="请选择当前站点招商人员" clearable filterable style="width: 100%">
          <el-option v-for="name in recruiterSelectOptions" :key="name" :label="name" :value="name" />
        </el-select>
      </el-form-item>

      <el-form-item label="发展人">
        <el-input v-model.trim="form.developer" placeholder="请输入发展人姓名（非必填）" />
      </el-form-item>

      <el-form-item label="推荐人" prop="recommender">
        <el-select v-model="form.recommender" placeholder="按代理ID或账号搜索" clearable filterable style="width: 100%">
          <el-option
            v-for="agent in teamAgentSelectOptions"
            :key="agent.id"
            :label="agent.id + ' / ' + agent.name"
            :value="agent.name"
          />
        </el-select>
      </el-form-item>

      <el-form-item label="代理状态" prop="agentStatus">
        <el-radio-group v-model="form.agentStatus">
          <el-radio :label="1">正常</el-radio>
          <el-radio :label="0">停用</el-radio>
        </el-radio-group>
      </el-form-item>

      <el-form-item label="代理备注" prop="agentRemark">
        <el-input v-model="form.agentRemark" type="textarea" placeholder="请输入代理备注" :rows="3" maxlength="200" show-word-limit />
      </el-form-item>
    </el-form>
    <div slot="footer" class="dialog-footer">
      <el-button type="primary" :loading="submitLoading" @click="submitForm">确 定</el-button>
      <el-button :disabled="submitLoading" @click="cancel">取 消</el-button>
    </div>
  </el-dialog>

  <el-dialog title="修改密码" :visible.sync="resetPwdOpen" width="500px" append-to-body>
    <el-form ref="resetPwdForm" :model="resetPwdForm" :rules="resetPwdRules" label-width="100px">
      <el-form-item label="代理账号">
        <el-input v-model="resetPwdForm.name" disabled />
      </el-form-item>
      <el-form-item label="新密码" prop="newPassword">
        <el-input v-model="resetPwdForm.newPassword" type="password" placeholder="请输入新密码" show-password />
      </el-form-item>
      <el-form-item label="确认密码" prop="confirmPassword">
        <el-input v-model="resetPwdForm.confirmPassword" type="password" placeholder="请确认新密码" show-password />
      </el-form-item>
    </el-form>
    <div slot="footer" class="dialog-footer">
      <el-button type="primary" @click="submitResetPwd">确 定</el-button>
      <el-button @click="resetPwdOpen = false">取 消</el-button>
    </div>
  </el-dialog>
</div>
